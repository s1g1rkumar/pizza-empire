# Nginx Production Configuration for Pizza Empire Tycoon
# Place at: /etc/nginx/sites-available/pizza-empire.conf

server {
    listen 80;
    listen [::]:80;
    server_name pizzaempire.example.com www.pizzaempire.example.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pizzaempire.example.com www.pizzaempire.example.com;

    # TLS Certificates (managed by Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/pizzaempire.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pizzaempire.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://pizzaempire.example.com;" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Frontend Static Assets (React + Vite build)
    root /var/www/pizza-empire/frontend/dist;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA Fallback (handles /dashboard, /game/*, and /admin/*)
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/pizza-empire-access.log;
    error_log /var/log/nginx/pizza-empire-error.log;
}
