# Development Docker Compose (MySQL 8 + Backend + Frontend)
services:
  mysql:
    image: mysql:8.0
    container_name: pizza-empire-mysql-dev
    environment:
      MYSQL_DATABASE: ${DB_NAME:-pizza_empire_dev}
      MYSQL_USER: ${DB_USER:-pizza_dev}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in local .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in local .env}
    ports:
      - '3306:3306'
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: pizza-empire-api-dev
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:4000/api/v1
    container_name: pizza-empire-web-dev
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mysql_dev_data:
